<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document feedback</title>
<style>
  :root { --ink:#1a1a2e; --muted:#6b6b80; --rule:#e2e4ea; --accent:#1a4d7a; --rec:#d22; --bg:#f3f4f7; --pin:#e8710a; --hl:rgba(255,213,0,.38); --hlsel:rgba(255,170,0,.55); }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--rule); padding:8px 18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  .tools { display:flex; border:1px solid var(--rule); border-radius:9px; overflow:hidden; }
  .tools button { border:0; border-radius:0; border-right:1px solid var(--rule); }
  .tools button:last-child { border-right:0; }
  .tools button.on { background:var(--accent); color:#fff; }
  .spacer { flex:1; }
  button, select { font:inherit; border:1px solid var(--rule); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.rec { background:var(--rec); color:#fff; border-color:var(--rec); }
  button.small { padding:3px 8px; font-size:13px; }
  kbd { font-size:11px; color:var(--muted); margin-left:4px; }
  .tools button.on kbd { color:#cfe0f0; }
  #status { font-size:13px; color:var(--muted); min-width:100px; }
  #hint { color:var(--muted); font-size:13px; padding:6px 18px 0; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 400px; gap:18px; padding:12px 18px 18px; }
  #pages { display:flex; flex-direction:column; align-items:center; gap:18px; }
  .page { position:relative; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.12); max-width:900px; width:100%; }
  .page img { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  .layer { position:absolute; inset:0; }
  body.t-text .layer { cursor:text; } body.t-area .layer, body.t-pin .layer { cursor:crosshair; }
  .page .bar { position:absolute; top:4px; right:4px; z-index:3; }
  .page .num { position:absolute; top:6px; left:8px; font-size:12px; color:var(--muted); z-index:3; }
  .hl { position:absolute; background:var(--hl); border-radius:2px; pointer-events:none; }
  .hl.sel { background:var(--hlsel); }
  .box { position:absolute; border:2px dashed var(--accent); background:rgba(26,77,122,.06); pointer-events:none; }
  .box.sel { border-style:solid; background:rgba(26,77,122,.12); }
  .tag { position:absolute; transform:translate(-50%,-100%); background:var(--pin); color:#fff; font-size:12px; font-weight:700;
         min-width:22px; height:22px; border-radius:11px 11px 11px 2px; display:flex; align-items:center; justify-content:center;
         padding:0 6px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.35); z-index:2; }
  .tag.sel { outline:3px solid var(--accent); }
  .tag.recording { background:var(--rec); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:translate(-50%,-100%) scale(1.15); } }
  aside { position:sticky; top:64px; align-self:start; max-height:calc(100vh - 80px); overflow:auto; }
  .round { background:#fff; border:1px solid var(--rule); border-radius:10px; padding:10px 12px; margin-bottom:12px; }
  .round label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  .round textarea { width:100%; min-height:40px; font:inherit; font-size:14px; border:1px solid var(--rule); border-radius:6px; padding:6px; }
  .card { background:#fff; border:1px solid var(--rule); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .card.sel { border-color:var(--accent); box-shadow:0 0 0 2px rgba(26,77,122,.15); }
  .card .top { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .badge { background:var(--pin); color:#fff; border-radius:10px; padding:0 7px; font-weight:700; margin-right:6px; }
  .badge.doc { background:var(--accent); }
  .quote { font-size:13px; border-left:3px solid #f0c000; padding:2px 8px; margin-top:6px; color:#333; max-height:4.6em; overflow:hidden; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .chip { font-size:12px; padding:2px 8px; border-radius:12px; border:1px solid var(--rule); background:#fff; cursor:pointer; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip.intent.on { background:#7a4d1a; border-color:#7a4d1a; }
  .card audio { width:100%; height:32px; margin-top:6px; }
  .card textarea { width:100%; min-height:40px; margin-top:6px; font:inherit; font-size:14px; border:1px solid var(--rule); border-radius:6px; padding:6px; resize:vertical; }
  .row { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; align-items:center; }
  .transcript { font-size:13px; background:#f6f7f9; border-radius:6px; padding:6px 8px; margin-top:6px; }
  .outcome { font-size:13px; margin-top:6px; color:#1b6e3a; }
  .timer { font-variant-numeric:tabular-nums; color:var(--rec); font-weight:600; }
  .empty { color:var(--muted); font-size:14px; padding:8px; }
  #micerr { display:none; background:#fff3cd; border:1px solid #f0d58a; padding:8px 12px; border-radius:8px; margin:8px 18px 0; font-size:14px; }
</style>
</head>
<body class="t-text">
<header>
  <h1 id="title">Document feedback</h1>
  <div class="tools">
    <button data-tool="text" class="on" title="Drag across words">Text<kbd>T</kbd></button>
    <button data-tool="area" title="Draw a box around a region">Area<kbd>A</kbd></button>
    <button data-tool="pin" title="Click a spot">Pin<kbd>P</kbd></button>
  </div>
  <button id="docbtn">🎙 Whole document</button>
  <span class="spacer"></span>
  <span id="status">loading…</span>
  <button class="primary" id="submit">Submit round</button>
</header>
<div id="hint"></div>
<div id="micerr"></div>
<main>
  <div id="pages"></div>
  <aside>
    <div class="round">
      <label>Verdict on this version</label>
      <div class="chips" id="verdicts"></div>
      <label style="margin-top:8px">Overall note (optional)</label>
      <textarea id="gnote" placeholder="Anything about the round as a whole"></textarea>
    </div>
    <div id="list"></div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
let ITEMS = null, LAYOUT = [], INTENTS = [], VERDICTS = [], comments = [], sel = null, recState = null, saveT = null, outcomes = {};
let tool = "text", verdict = null, gnote = "", drag = null;
const anchors = {};
const uid = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const fmt = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const hasCat = c => (ITEMS.categories || []).includes(c);
const defaultCat = scope => scope === "text" && hasCat("Wording") ? "Wording" : scope === "area" && hasCat("Layout & spacing") ? "Layout & spacing" : null;

function setTool(t) { tool = t; document.body.className = "t-" + t; document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === t)); }
function ordered() {
  const o = { document: 0, page: 1, point: 2, text: 2, area: 2 };
  const top = c => c.y != null ? c.y : (c.rects ? c.rects[0][1] : 0);
  return [...comments].sort((a, b) => (a.page || 0) - (b.page || 0) || o[a.scope] - o[b.scope] || top(a) - top(b));
}

// ---- text selection on the word boxes (positions only; the text is cut from the PDF server-side)
function nearestWord(pageN, u, v) {
  const lines = LAYOUT[pageN - 1] || []; let best = null;
  lines.forEach((l, li) => l.words.forEach((w, wi) => {
    const dx = u < w[0] ? w[0] - u : u > w[2] ? u - w[2] : 0, dy = v < w[1] ? w[1] - v : v > w[3] ? v - w[3] : 0;
    const d = dy * 4 + dx; if (!best || d < best.d) best = { li, wi, d };
  }));
  return best && best.d < 0.04 ? best : null;
}
function spanRects(pageN, a, b) {
  const lines = LAYOUT[pageN - 1];
  if (b.li < a.li || (b.li === a.li && false)) [a, b] = [b, a];
  const out = [];
  for (let li = a.li; li <= b.li; li++) {
    const l = lines[li]; let ws = l.words.map((w, i) => i);
    if (a.li === b.li) { const lo = Math.min(a.wi, b.wi), hi = Math.max(a.wi, b.wi); ws = ws.filter(i => i >= lo && i <= hi); }
    else if (li === a.li) ws = ws.filter(i => l.rtl ? i <= a.wi : i >= a.wi);
    else if (li === b.li) ws = ws.filter(i => l.rtl ? i >= b.wi : i <= b.wi);
    if (!ws.length) continue;
    const bx = ws.map(i => l.words[i]);
    out.push([Math.min(...bx.map(r => r[0])), Math.min(...bx.map(r => r[1])), Math.max(...bx.map(r => r[2])), Math.max(...bx.map(r => r[3]))]);
  }
  return out;
}

async function load() {
  const r = await (await fetch("api/session")).json();
  ITEMS = r.items; LAYOUT = r.layout || []; INTENTS = r.intents || []; VERDICTS = r.verdicts || [];
  comments = r.comments || []; outcomes = r.outcomes || {};
  verdict = (r.response || {}).verdict || null; gnote = (r.response || {}).general_note || "";
  $("#title").textContent = ITEMS.title || "Document feedback";
  $("#hint").textContent = ITEMS.instructions || "";
  document.title = "Feedback – " + (ITEMS.title || "document");
  $("#gnote").value = gnote; $("#gnote").oninput = e => { gnote = e.target.value; save(); };
  renderVerdicts();
  for (const p of ITEMS.pages) {
    const d = document.createElement("div");
    d.className = "page"; d.dataset.page = p.n;
    d.innerHTML = `<span class="num">Page ${p.n}</span><div class="bar"><button class="small" data-pagebtn>🎙 This page</button></div><img src="${p.img}" alt="Page ${p.n}" draggable="false"><div class="layer"></div>`;
    const layer = d.querySelector(".layer");
    const pos = ev => { const rc = layer.getBoundingClientRect(); return [(ev.clientX - rc.left) / rc.width, (ev.clientY - rc.top) / rc.height]; };
    layer.addEventListener("mousedown", ev => {
      if (ev.button !== 0) return; ev.preventDefault();
      const [u, v] = pos(ev);
      if (tool === "pin") return addComment({ scope: "point", page: p.n, x: u, y: v });
      if (tool === "text") { const w = nearestWord(p.n, u, v); if (!w) return; drag = { kind: "text", page: p.n, a: w, b: w, layer }; }
      else drag = { kind: "area", page: p.n, u0: u, v0: v, u1: u, v1: v, layer };
      drawDrag();
    });
    layer.addEventListener("mousemove", ev => {
      if (!drag || drag.page !== p.n) return; const [u, v] = pos(ev);
      if (drag.kind === "text") { const w = nearestWord(p.n, u, v); if (w) drag.b = w; } else { drag.u1 = u; drag.v1 = v; }
      drawDrag();
    });
    d.querySelector("[data-pagebtn]").addEventListener("click", () => addComment({ scope: "page", page: p.n }));
    $("#pages").appendChild(d);
  }
  window.addEventListener("mouseup", () => {
    if (!drag) return; const g = drag; drag = null; document.querySelectorAll(".dragging").forEach(e => e.remove());
    if (g.kind === "text") {
      const a = g.a.li < g.b.li || (g.a.li === g.b.li) ? g.a : g.b, b = a === g.a ? g.b : g.a;
      addComment({ scope: "text", page: g.page, rects: spanRects(g.page, a, b) });
    } else {
      const r = [Math.min(g.u0, g.u1), Math.min(g.v0, g.v1), Math.max(g.u0, g.u1), Math.max(g.v0, g.v1)];
      if (r[2] - r[0] < 0.01 || r[3] - r[1] < 0.008) addComment({ scope: "point", page: g.page, x: g.u0, y: g.v0 });
      else addComment({ scope: "area", page: g.page, rects: [r] });
    }
  });
  render(); setStatus((r.response || {}).status || "draft");
}

function drawDrag() {
  const L = drag.layer; L.querySelectorAll(".dragging").forEach(e => e.remove());
  let rects = [];
  if (drag.kind === "text") { const a = drag.a.li <= drag.b.li ? drag.a : drag.b, b = a === drag.a ? drag.b : drag.a; rects = spanRects(drag.page, a, b); }
  else rects = [[Math.min(drag.u0, drag.u1), Math.min(drag.v0, drag.v1), Math.max(drag.u0, drag.u1), Math.max(drag.v0, drag.v1)]];
  for (const r of rects) { const e = document.createElement("div"); e.className = (drag.kind === "text" ? "hl sel" : "box") + " dragging"; place(e, r); L.appendChild(e); }
}
function place(e, r) { e.style.left = r[0] * 100 + "%"; e.style.top = r[1] * 100 + "%"; e.style.width = (r[2] - r[0]) * 100 + "%"; e.style.height = (r[3] - r[1]) * 100 + "%"; }

function renderVerdicts() {
  const V = $("#verdicts"); V.innerHTML = "";
  for (const v of VERDICTS) { const b = document.createElement("span"); b.className = "chip" + (verdict === v ? " on" : ""); b.textContent = v;
    b.onclick = () => { verdict = verdict === v ? null : v; renderVerdicts(); save(); }; V.appendChild(b); }
}
function setStatus(t) { $("#status").textContent = t; }

async function addComment(c) {
  if (recState) await stopRec();
  c.id = uid(); c.note = ""; c.category = defaultCat(c.scope); comments.push(c); sel = c.id; render();
  await save(); if (c.rects) fetchAnchor(c.id);
  startRec(c.id);
}
async function fetchAnchor(id) {
  try { const a = await (await fetch("api/anchor?id=" + id)).json(); anchors[id] = a.quote || a.line || ""; render(); } catch (e) {}
}

function render() {
  document.querySelectorAll(".layer > :not(.dragging)").forEach(e => e.remove());
  const list = ordered();
  list.forEach((c, i) => {
    c._n = i + 1; if (!c.page || c.scope === "page") return;
    const L = document.querySelector(`.page[data-page="${c.page}"] .layer`); const on = c.id === sel;
    let tx, ty;
    if (c.rects) {
      for (const r of c.rects) { const e = document.createElement("div"); e.className = (c.scope === "text" ? "hl" : "box") + (on ? " sel" : ""); place(e, r); L.appendChild(e); }
      tx = c.rects[0][0]; ty = c.rects[0][1];
    } else { tx = c.x; ty = c.y; }
    const t = document.createElement("div");
    t.className = "tag" + (on ? " sel" : "") + (recState && recState.id === c.id ? " recording" : "");
    t.style.left = tx * 100 + "%"; t.style.top = ty * 100 + "%"; t.textContent = c._n;
    t.onmousedown = e => e.stopPropagation();
    t.onclick = () => { sel = c.id; render(); document.getElementById("card-" + c.id)?.scrollIntoView({ block: "nearest" }); };
    L.appendChild(t);
  });
  const L = $("#list"); L.innerHTML = "";
  if (!list.length) { L.innerHTML = '<div class="empty">No comments yet. Drag across words (Text), draw a box (Area) or click (Pin), then talk. “Whole document” for overall points.</div>'; return; }
  for (const c of list) {
    const kind = { document: "Whole document", page: `Page ${c.page}`, point: `Page ${c.page} · pin`, text: `Page ${c.page} · text`, area: `Page ${c.page} · area` }[c.scope];
    const rec = recState && recState.id === c.id;
    const div = document.createElement("div");
    div.className = "card" + (c.id === sel ? " sel" : ""); div.id = "card-" + c.id;
    const cats = (ITEMS.categories || []).map(k => `<span class="chip${c.category === k ? " on" : ""}" data-cat="${esc(k)}">${esc(k)}</span>`).join("");
    const ints = c.category === "Wording" ? INTENTS.map(k => `<span class="chip intent${c.intent === k ? " on" : ""}" data-int="${esc(k)}">${esc(k)}</span>`).join("") : "";
    div.innerHTML = `<div class="top"><span><span class="badge ${c.scope === "document" || c.scope === "page" ? "doc" : ""}">${c._n}</span>${kind}</span><button class="small" data-del title="Delete">✕</button></div>
      ${anchors[c.id] ? `<div class="quote">${esc(anchors[c.id])}</div>` : ""}
      <div class="chips">${cats}</div>${ints ? `<div class="chips">${ints}</div>` : ""}
      <div class="row">${rec ? `<button class="rec small" data-stop>■ Stop</button><span class="timer" id="timer">0:00</span>`
        : `<button class="small" data-rec>${c.audio ? "🎙 Re-record" : "🎙 Record"}</button>${c.duration_s ? `<span style="font-size:12px;color:var(--muted)">${fmt(c.duration_s)}</span>` : ""}`}</div>
      ${c.audio && !rec ? `<audio controls preload="none" src="audio/${c.audio}?t=${c._v || 0}"></audio>` : ""}
      ${c.transcript ? `<div class="transcript">${esc(c.transcript)}</div>` : ""}
      <textarea placeholder="…or type a note">${esc(c.note || "")}</textarea>
      ${outcomes[c.id] ? `<div class="outcome">${esc(outcomes[c.id].state + (outcomes[c.id].text ? ": " + outcomes[c.id].text : ""))}</div>` : ""}`;
    div.onclick = e => { if (!["TEXTAREA", "AUDIO", "BUTTON"].includes(e.target.tagName) && !e.target.classList.contains("chip") && sel !== c.id) { sel = c.id; render(); } };
    div.querySelector("[data-del]").onclick = async e => { e.stopPropagation(); if (rec) await stopRec(true); comments = comments.filter(x => x.id !== c.id); render(); save(); };
    div.querySelectorAll("[data-cat]").forEach(ch => ch.onclick = e => { e.stopPropagation(); c.category = c.category === ch.dataset.cat ? null : ch.dataset.cat; if (c.category !== "Wording") delete c.intent; render(); save(); });
    div.querySelectorAll("[data-int]").forEach(ch => ch.onclick = e => { e.stopPropagation(); c.intent = c.intent === ch.dataset.int ? null : ch.dataset.int; render(); save(); });
    const rb = div.querySelector("[data-rec]"); if (rb) rb.onclick = e => { e.stopPropagation(); sel = c.id; startRec(c.id); };
    const sb = div.querySelector("[data-stop]"); if (sb) sb.onclick = e => { e.stopPropagation(); stopRec(); };
    div.querySelector("textarea").oninput = e => { c.note = e.target.value; save(); };
    L.appendChild(div);
  }
}

let stream = null;
async function startRec(id) {
  if (recState) await stopRec();
  try { stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { const m = $("#micerr"); m.style.display = "block"; m.textContent = "Microphone not available (" + e.message + "). You can still type notes."; render(); return; }
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  const chunks = []; const t0 = Date.now();
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  recState = { id, mr, chunks, t0, tick: setInterval(() => { const t = $("#timer"); if (t) t.textContent = fmt((Date.now() - t0) / 1000); }, 250) };
  mr.start(1000); render(); setStatus("recording…");
}
function stopRec(discard) {
  return new Promise(resolve => {
    if (!recState) return resolve();
    const { id, mr, chunks, t0, tick } = recState; clearInterval(tick);
    mr.onstop = async () => {
      recState = null;
      const c = comments.find(x => x.id === id);
      if (!discard && c && chunks.length && Date.now() - t0 > 600) {
        setStatus("uploading…");
        const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
        const r = await fetch(`api/audio?id=${id}&ext=webm`, { method: "POST", body: blob });
        if (r.ok) { c.audio = (await r.json()).audio; c.duration_s = Math.round((Date.now() - t0) / 100) / 10; c._v = Date.now(); delete c.transcript; }
      }
      render(); await save(); resolve();
    };
    mr.stop();
  });
}
async function save(submit) {
  clearTimeout(saveT);
  const go = async () => {
    const body = { comments: comments.map(({ _n, _v, ...c }) => c), submit: !!submit, verdict, general_note: gnote };
    const r = await fetch("api/comments", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json(); setStatus(j.status === "submitted" ? "submitted ✓" : "saved " + new Date().toLocaleTimeString());
  };
  if (submit) return go();
  return new Promise(res => { saveT = setTimeout(async () => { await go(); res(); }, 300); });
}

document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));
$("#docbtn").onclick = () => addComment({ scope: "document" });
$("#submit").onclick = async () => { if (recState) await stopRec(); await save(true); };
document.addEventListener("keydown", async e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "Escape" && recState) { e.preventDefault(); return stopRec(); }
  const k = e.key.toLowerCase();
  if (k === "t") setTool("text"); else if (k === "a") setTool("area"); else if (k === "p") setTool("pin");
  else if (k === "r" && sel && !recState) { e.preventDefault(); startRec(sel); }
});
setInterval(async () => {  // pick up transcripts and outcomes written while the page is open
  if (recState || drag) return;
  try {
    const r = await (await fetch("api/session")).json(); outcomes = r.outcomes || {}; let changed = false;
    for (const c of r.comments || []) { const m = comments.find(x => x.id === c.id); if (m && c.transcript && m.transcript !== c.transcript && m.audio === c.audio) { m.transcript = c.transcript; changed = true; } }
    if (changed && !document.activeElement?.matches("textarea")) render();
  } catch (e) {}
}, 5000);
comments.forEach(c => c.rects && fetchAnchor(c.id));
load().then(() => comments.forEach(c => c.rects && fetchAnchor(c.id)));
</script>
</body>
</html>
